# Статья «Как тестировать API: 20 проверок» (Хабр, Нетология). Названия — пересказ.
# applicable: false + reason — проверка не имеет смысла для нашего API;
# partial — какую часть проверки сделать нельзя (покрытие будет отмечено как частичное).
api_checks:
  - id: 1
    title: Код успешного ответа соответствует контракту
  - id: 2
    title: "Структура ответа: обязательные поля на месте, лишних нет"
    note: >-
      Swagger не запрещает дополнительные свойства, поэтому «лишние» поля контракт не нарушают;
      обязательные поля и типы проверяет JSON Schema
  - id: 3
    title: Типы и форматы полей ответа
  - id: 4
    title: Значения в ответе соответствуют запросу и данным системы
  - id: 5
    title: Бизнес-логика ответа; в ответах нет закрытых данных (пароли, хеши, лишние поля)
  - id: 6
    title: Обязательные поля запроса
  - id: 7
    title: Пустые строки, строки из пробелов, null
  - id: 8
    title: Неверный тип или формат входных данных — без молчаливого приведения
  - id: 9
    title: Граничные значения и классы эквивалентности
  - id: 10
    title: "Неизвестные и серверные поля в запросе: клиент не меняет защищённые свойства"
    note: >-
      Неизвестные поля Swagger не запрещает — их игнорирование нормально; подмену серверного
      поля id проверяет тест mass assignment
  - id: 11
    title: Свой корректный код ошибки для каждой причины
  - id: 12
    title: "Тело ошибки: стабильная структура, status в теле равен HTTP-статусу"
  - id: 13
    title: Ошибка не раскрывает стек, SQL, пути, секреты
  - id: 14
    title: "Аутентификация: токена нет, токен испорчен, токен истёк"
    partial: Истёкший токен получить нельзя — срок жизни токена нами не управляется
  - id: 15
    title: "Доступ к чужому объекту (BOLA): чтение, изменение, удаление"
  - id: 16
    title: Доступ к функции по роли (BFLA)
  - id: 17
    title: Состояние объекта после операции
  - id: 18
    title: Побочные эффекты в связанных сущностях
    applicable: false
    reason: В нашем API нет связанных сущностей (склада, платежей и т.п.) — только контакты пользователя
  - id: 19
    title: Повтор запроса и идемпотентность
  - id: 20
    title: Согласованность эндпоинтов в цепочке операций

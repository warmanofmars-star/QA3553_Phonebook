# Справочник требований проекта: источник для матрицы покрытия (ci/coverage_matrix.py).
#
# Здесь КРАТКИЙ ПЕРЕСКАЗ требований своими словами, а не текст документов:
# сами SRS и STD лежат только локально в docs/requirements/ и в git не попадают.
#
# Как тест попадает в матрицу — тегом Allure:
#   SRS-T41, SRS-F3   — пункт SRS          @allure.tag("SRS-T41")
#   TC-0012           — кейс STD           @allure.tag("TC-0012")
#   API-CHECK-15      — проверка API       @allure.tag("API-CHECK-15")
# Для параметризованных тестов теги задаются параметрами test_case и requirements
# (см. ci/coverage_matrix.py). Тег ставится, только если assert теста прямо проверяет пункт.
#
# testable: false + reason — пункт нельзя проверить в нашем окружении; в покрытии не учитывается.

srs:
  document: Phone Book SRS 2.0 (docs/requirements/, только локально)
  sections:
    - id: Customer
      title: "Регистрация пользователя: email и пароль (T1–T15)"
    - id: New Contact
      title: "Создание контакта: правила полей (T16–T48)"
    - id: Update Contact
      title: "Редактирование контакта: правила полей (T54–T86)"
    - id: Login
      title: "Регистрация и вход: сообщения об ошибках (F1–F4)"
    - id: Add
      title: "Добавление контакта: сообщения об ошибках (F5–F9)"
    - id: Update
      title: "Редактирование контакта: невалидные данные не сохраняются (F10–F14)"
    - id: Manager
      title: "Действия менеджера (F15–F16)"
  # Пропуски в нумерации самого документа: это не потерянные требования
  numbering_gaps:
    - ids: T49–T53
      note: В SRS этих номеров нет — после T48 сразу идёт T54


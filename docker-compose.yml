networks:
  qa-network:
    name: qa-network
    driver: bridge

# Создаем изолированный виртуальный диск внутри Докера
volumes:
  video-data:
    name: video-data

services:
  selenoid:
    # 👇 Заменили скачивание готового образа на локальную сборку
    build:
      context: .
      dockerfile: Dockerfile.selenoid
    networks:
      - qa-network
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "video-data:/opt/selenoid/video" # Подключаем диск к Селеноиду
      # ❌ Строчку с ./selenoid:/etc/selenoid:ro мы УДАЛИЛИ
    ports:
      - "4444:4444"
    environment:
      - DOCKER_API_VERSION=1.41
      - OVERRIDE_VIDEO_OUTPUT_DIR=video-data # Магия Селеноида для связи с томом
    command: ["-conf", "/etc/selenoid/browsers.json", "-video-output-dir", "/opt/selenoid/video", "-container-network", "qa-network"]

  qa-framework:
    build: .
    depends_on:
      - selenoid
    networks:
      - qa-network
    volumes:
      - "./allure-results:/app/allure-results"
      - "video-data:/app/video" # Подключаем этот же диск к нашему фреймворку
    environment:
      - USE_SELENOID=true
      - SELENOID_HUB_URL=http://selenoid:4444/wd/hub
      - VIDEO_DIR=/app/video
      - BASE_URL=https://telranedu.web.app
      - API_URL=https://contactapp-telran-backend.herokuapp.com
      # Параметры запуска, которые передают CI (GitHub Actions, Jenkins) или ты сам:
      #   BROWSER=firefox docker compose up ...                      (bash)
      #   $env:BROWSER="firefox"; docker compose up ...              (PowerShell)
      # Раньше BROWSER сюда не передавался, и выбор браузера в Jenkins молча игнорировался
      - BROWSER=${BROWSER:-chrome}
      # Дополнительные аргументы pytest, например -m "smoke" (pytest читает их сам)
      - PYTEST_ADDOPTS=${PYTEST_ADDOPTS:-}
    # Команда запуска тестов
    command: sh -c "pytest -n 2 --browser_name=$${BROWSER:-chrome} --video=on --clean-alluredir --alluredir=allure-results"
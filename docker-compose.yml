# Тестовый стенд: Selenium Grid 4 (хаб + узлы браузеров) и контейнер с тестами.
#
# Браузер выбирается ДВУМЯ переменными с одинаковым значением:
#   COMPOSE_PROFILES — какие узлы браузеров запустить (у каждого узла свой профиль);
#   BROWSER          — в каком браузере запускать тесты.
#
#   PowerShell:  $env:COMPOSE_PROFILES="firefox"; $env:BROWSER="firefox"; docker compose up --build --exit-code-from qa-framework
#   bash:        COMPOSE_PROFILES=firefox BROWSER=firefox docker compose up --build --exit-code-from qa-framework
#
# Без COMPOSE_PROFILES узлы не стартуют, и тесты упадут с понятной ошибкой
# (проверка готовности Grid в drivers/factory.py). Для локальной работы удобно
# прописать COMPOSE_PROFILES=chrome в .env — docker compose читает его сам.
#
# Grid UI (кто подключён, какие сессии идут): http://localhost:4444/ui/
# (косая черта в конце обязательна: без неё интерфейс не загружается)
# Останов: docker compose down

name: phonebook-tests

# Общие настройки узлов браузеров (YAML-якорь: подставляется в каждый узел через <<: *node)
x-node: &node
  shm_size: 2gb                      # браузерам нужна большая разделяемая память, иначе вкладки падают
  depends_on:
    - selenium-hub
  volumes:
    - video-data:/videos             # сюда узел пишет видео сессий
  environment:
    - SE_EVENT_BUS_HOST=selenium-hub # через шину событий хаба узел регистрируется в Grid
    - SE_NODE_GRID_URL=http://selenium-hub:4444
    # Запись видео встроена в образ узла. Файл: /videos/<id сессии>.mp4
    # (если тест не задаёт capability se:name). Отдельные видео-контейнеры не нужны
    - SE_RECORD_VIDEO=true
  deploy:
    # По 2 узла выбранного браузера — под 2 параллельных воркера pytest (-n 2).
    # Один узел = одна сессия: так стабильнее, и видео пишется ровно одной сессии
    replicas: 2

volumes:
  video-data:                        # общий том: узлы пишут видео, тесты прикладывают его к Allure

services:
  selenium-hub:
    image: selenium/hub:4.51.0-20261010
    ports:
      - "4444:4444"                  # Grid UI и подключение с хоста (локальный запуск с USE_GRID=true)

  chrome:
    <<: *node
    image: selenium/node-chrome:4.51.0-20261010
    platform: linux/amd64
    profiles: [chrome]

  firefox:
    <<: *node
    image: selenium/node-firefox:4.51.0-20261010
    profiles: [firefox]

  edge:
    <<: *node
    image: selenium/node-edge:4.51.0-20261010
    platform: linux/amd64
    profiles: [edge]

  qa-framework:
    build: .
    depends_on:
      - selenium-hub                 # готовность узлов проверяет drivers/factory.py (/status Grid)
    volumes:
      - "./allure-results:/app/allure-results"
      - "video-data:/app/video"      # тот же том: тесты находят видео по id сессии
    environment:
      - USE_GRID=true
      - GRID_URL=http://selenium-hub:4444
      - VIDEO_DIR=/app/video
      - BASE_URL=https://telranedu.web.app
      - API_URL=https://contactapp-telran-backend.herokuapp.com
      # Параметры запуска от CI (GitHub Actions, Jenkins) или от тебя (см. шапку файла)
      - BROWSER=${BROWSER:-chrome}
      # Дополнительные аргументы pytest, например -m "smoke" (pytest читает их сам)
      - PYTEST_ADDOPTS=${PYTEST_ADDOPTS:-}
    command: sh -c "pytest -n 2 --browser_name=$${BROWSER:-chrome} --video=on --clean-alluredir --alluredir=allure-results"

[pytest]
markers =
    smoke: Быстрые и критичные тесты базового функционала
    regression: Полный прогон всех тестов, включая негативные и баги
    security: Проверки уязвимостей и прав доступа
    api: Тесты бэкенда (без UI)
    ui: Тесты интерфейса (Selenium)
    playwright: UI тесты на движке Playwright
[pytest]
# --strict-markers: опечатка в маркере (@pytest.mark.smok) — ошибка, а не тихий пропуск теста
# -ra: в конце прогона краткая сводка по skipped/xfailed/xpassed/failed с причинами
addopts = --strict-markers -ra

# Любой xfail, который неожиданно прошёл (XPASS), роняет прогон.
# Известные баги помечаются через data/known_bugs.py — там strict включён явно,
# а эта настройка страхует "ручные" xfail.
xfail_strict = true

# ---------- Логирование (см. utils/logger.py) ----------
# Что попадает в отчёт: "Captured log" упавших тестов и вложение "log" в Allure
log_level = INFO
log_format = %(asctime)s [%(levelname)-7s] %(name)s: %(message)s
log_date_format = %H:%M:%S

# Логи в консоли в реальном времени — выключены, чтобы не засорять вывод.
# Включить для отладки:  pytest -o log_cli=true tests/test_login.py
# (с xdist -n не работает: воркеры не выводят логи в консоль главного процесса)
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-7s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Файл: путь задаётся в conftest.py (отдельный файл на каждый воркер xdist).
# В файл пишем подробнее (DEBUG): там есть и низкоуровневые действия Selenium из listener.
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)-7s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: Критические тесты (Smoke)
    regression: Полный регрессионный набор
    api: Чистые API тесты
    ui: Классические UI тесты (Selenium)
    playwright: Быстрые UI и Mock тесты на Playwright
    security: Тесты безопасности (BOLA, BFLA, Auth, Data Leaks)
    hybrid: Гибридные тесты (API Setup -> UI Action)

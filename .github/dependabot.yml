# Dependabot: обновления версий зависимостей проекта (настройки — docs.github.com,
# «Dependabot options reference» и «Configuring multi-ecosystem updates»).
# Как ревьюить PR бота и что делать, если он красный, — commands.md, раздел про Dependabot.
# Файл и версии в нём меняются только по задаче; PR бота ревьюит и сливает пользователь.
#
# Версии вне Dependabot (бот их не видит или намеренно пропускает — обновляются вручную):
#   - PIP_TOOLS_VERSION в ci/lock_requirements.sh — переменная shell, а не манифест;
#   - allure-commandline в .github/workflows/tests.yml — npm install -g без package.json;
#   - минорная версия Python в Dockerfile — намеренно в ignore (см. запись docker ниже);
#   - образ Jenkins в Dockerfile.jenkins — намеренно в ignore (см. запись docker ниже).
version: 2

# Одна группа на все экосистемы и раз в месяц. Причина — общий внешний бэкенд: каждый PR бота
# запускает полный CI, а каждый прогон Phonebook навсегда регистрирует на бэкенде пользователей
# (удалить их нельзя) — порядка 260 за прогон (оценка задачи 9-0 по сбору тестов, не замер).
# Без группы было бы по PR, а значит и по прогону, на каждое обновление.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "monthly"
    # Заголовок и коммит — в стиле истории проекта: «build(deps): …» (Conventional Commits).
    # commit-message у multi-ecosystem группы задаётся только на уровне группы
    commit-message:
      prefix: "build"
      include: "scope"

# У каждой записи: patterns ["*"] — все зависимости экосистемы идут в общую группу (patterns
# обязателен для участника multi-ecosystem группы); расписание задаёт группа.
#
# cooldown 14 дней: версия моложе двух недель в PR не попадает — за это время свежий выпуск
# успевают отозвать или исправить. Только default-days: semver-*-days поддерживают не все
# экосистемы (docker, docker-compose, github-actions, pre-commit — нет). Ловушка: в группе
# выдержка оценивается для группы, а не для каждого пакета, — групповой PR может подтянуть пакет
# моложе 14 дней. Поэтому при ревью PR бота сверяются даты выпуска. Security updates идут
# без выдержки и вне расписания.
updates:
  # requirements.in → requirements.txt и requirements-dev.in → requirements-dev.txt (pip-compile):
  # бот правит пины в *.in и пересобирает lock-файлы своей версией pip-tools
  # (job Lint поэтому сравнивает пины, а не текст — ci/compare_lock_pins.py)
  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 14

  # rev внешних хуков (pre-commit-hooks, gitleaks); local-хуки (ruff, check-jsonschema,
  # check-selenium-images) бот пропускает: их версии — в requirements-dev.in, это экосистема pip
  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 14

  # Actions в .github/workflows: первой стороны (actions/*) — на тегах (@v7); сторонний
  # peaceiris/actions-gh-pages — на SHA с комментарием версии (# v4.1.0): бот обновляет SHA
  # вместе с комментарием
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 14

  # Базовые образы в Dockerfile (тесты) и Dockerfile.jenkins (Jenkins): бот находит в каталоге
  # все файлы с «Dockerfile» в имени, поэтому Jenkins тоже сюда попадает — см. ignore
  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 14
    ignore:
      # Для python — только патчи: переход на новую минорную Python (3.14 → 3.15) меняет
      # совместимость (ruff target py312, локальный .venv, lock-файлы) — это отдельное осознанное
      # решение, а не PR бота
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Jenkins — никаких обновлений от бота: CI Jenkins не собирает и не запускает, зелёный PR
      # ничего бы о нём не проверил. Обновляется вручную: правка FROM в Dockerfile.jenkins,
      # пересборка и проверка локально (только вперёд — см. шапку Dockerfile.jenkins)
      - dependency-name: "jenkins/jenkins"

  # Образы Selenium Grid (хаб и узлы) в docker-compose.yml
  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 14
    # Selenium публикует один образ под двумя схемами тегов: по версии Grid (4.51.0-20261010)
    # и по версии браузера (141.0-20261010; дата сборки та же — это тот же образ). Бот сравнивает
    # числа и выбирает «бо́льшие»: в соседнем проекте (IlCarro) он перевёл узлы на теги браузеров,
    # а хаб, у которого такой схемы нет, оставил на версии Grid. Держимся схемы Grid: хаб и узлы
    # должны быть на одной версии Grid (иначе узлы не подключаются к хабу), и по тегам это сразу
    # видно. Grid обновляется только внутри 4.x. Условие «>= 5» отсекает и теги по версии браузера
    # (там условие «>= 100» пропустило 99.0-…), и Selenium 5 — мажор Grid меняется вручную,
    # вместе с шаблоном тега в ci/check_selenium_images.py (см. commands.md).
    # (версии Docker — синтаксис Bundler, см. «versions (ignore)» в Dependabot options reference)
    ignore:
      - dependency-name: "selenium/*"
        versions: [">= 5"]

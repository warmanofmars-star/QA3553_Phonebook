name: Phonebook UI Tests

on:
  workflow_dispatch: # Эта строчка создает кнопку "Запустить вручную" на GitHub
      inputs:
        allow_mass_delete:
          description: 'Включить полное удаление всех контактов (DANGER!)'
          required: false
          type: boolean
          default: false

jobs:
  test:
    runs-on: ubuntu-latest # Виртуальная машина на Linux

    steps:
      - name: Скачиваем код проекта
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Версия питона

      - name: Устанавливаем браузер Edge (для Headless режима)
        uses: browser-actions/setup-edge@v1

      - name: Устанавливаем библиотеки (requirements)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запускаем автотесты
        env:
          BASE_URL: "https://telranedu.web.app"          # Несекретная настройка — пишем открыто
          USER_EMAIL: ${{ secrets.USER_EMAIL }}          # Секреты — тянем из сейфа GitHub
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          ALLOW_MASS_DELETE: ${{ github.event.inputs.allow_mass_delete }} #пылесос
        # Добавили флаги для перезапуска упавших тестов (2 попытки с паузой в 2 секунды)
        run: pytest tests/ --reruns 2 --reruns-delay 2 --alluredir=allure-results
        continue-on-error: true # ВАЖНО: продолжаем работу, даже если тесты упадут, чтобы отправить отчет!

      - name: Генерируем Allure отчет
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Публикуем отчет на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # Этот токен GitHub выдает сам, создавать секрет НЕ НУЖНО!
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Отправляем уведомление в Telegram
        uses: appleboy/telegram-action@master
        if: always()
        with:
            to: ${{ secrets.TELEGRAM_TO }}
            token: ${{ secrets.TELEGRAM_TOKEN }}
            # Меняем текст сообщения, теперь отправляем просто ссылку на сайт!
            message: |
              🤖 Автотесты Phonebook завершены!
              📊 Посмотреть Allure-отчет можно по ссылке:
              👉 https://warmanofmars-star.github.io/QA3553_Phonebook/
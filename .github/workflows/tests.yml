name: Phonebook Tests

# ==========================================
# КОГДА ЗАПУСКАЕТСЯ
# ==========================================
on:
  push:
    branches: [main]          # каждое изменение main проверяется автоматически
  pull_request:
    branches: [main]          # и каждый PR в main — ДО слияния (quality gate)
  workflow_dispatch:          # ручной запуск из вкладки Actions
    inputs:
      test_marker:
        description: 'Маркеры pytest: smoke, api, "api and security"... Пусто — все тесты'
        required: false
        type: string
        default: ''

# Минимальные права по умолчанию. Право на запись выдаётся только job отчёта
permissions:
  contents: read

# Новый пуш в ту же ветку PR отменяет устаревший прогон. Прогоны main не прерываем,
# чтобы опубликованный отчёт всегда соответствовал последнему завершённому прогону
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================
  # JOB 0: ЛИНТЕР И МАТРИЦА ПОКРЫТИЯ (параллельно с тестами, занимает минуту-две)
  # ==========================================
  # Те же проверки, что делает pre-commit локально. Локальный хук можно обойти
  # (git commit --no-verify) или просто не установить — проверку в CI обойти нельзя
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-22.04
    timeout-minutes: 10              # установка зависимостей для сбора тестов — около минуты
    steps:
      - name: Скачиваем код проекта
        uses: actions/checkout@v7

      - name: Проверяем код линтером и форматтером
        run: |
          python3 -m pip install --quiet ruff==0.17.1   # та же версия, что в requirements-dev.txt
          ruff check --output-format=github .           # замечания появятся прямо в diff PR
          ruff format --check .

      # Генератору матрицы нужен pytest со всеми плагинами и conftest.py проекта:
      # он собирает тесты (не запуская их). Python — тот же, что в Docker-образе с тестами
      - name: Ставим Python и зависимости проекта
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Устанавливаем зависимости
        run: python -m pip install --quiet -r requirements-dev.txt

      # Матрица docs/coverage.md строится из тегов тестов. Если тесты или справочник
      # требований изменились, а матрицу не пересобрали — шаг упадёт и покажет расхождение
      - name: Проверяем, что матрица покрытия актуальна
        run: python ci/coverage_matrix.py --check

  # ==========================================
  # JOB 0.1: ПОИСК СЕКРЕТОВ В НОВЫХ КОММИТАХ (параллельно с тестами)
  # ==========================================
  # Тот же gitleaks, что в pre-commit, но его не обойти через --no-verify.
  # Проверяем ТОЛЬКО новые коммиты: в старой истории есть известная утечка,
  # и полный скан падал бы всегда, ничего не сообщая о новом коде
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Скачиваем код проекта со всей историей
        uses: actions/checkout@v7
        with:
          fetch-depth: 0              # нужны коммиты диапазона, а не только последний

      - name: Ищем секреты в новых коммитах
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # Диапазон в синтаксисе git log: что проверять
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="$PR_BASE..$PR_HEAD"            # все коммиты PR
          elif [ -n "$PUSH_BEFORE" ] && [ -n "${PUSH_BEFORE//0/}" ]; then
            LOG_OPTS="$PUSH_BEFORE..$CURRENT_SHA"    # коммиты, пришедшие этим push
          else
            # Новая ветка (before из одних нулей) или ручной запуск (before нет):
            # предыдущего состояния нет — проверяем только последний коммит
            LOG_OPTS="-1 $CURRENT_SHA"
          fi
          echo "Проверяемые коммиты: $LOG_OPTS"

          # Официальный образ той же версии, что в .pre-commit-config.yaml.
          # --redact: найденный секрет не попадёт в публичный лог GitHub Actions
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --log-opts="$LOG_OPTS"

  # ==========================================
  # JOB 1: ТЕСТЫ В НЕСКОЛЬКИХ БРАУЗЕРАХ ПАРАЛЛЕЛЬНО (МАТРИЦА)
  # ==========================================
  test-execution:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30       # зависший прогон не будет висеть 6 часов (лимит GitHub по умолчанию)
    strategy:
      fail-fast: false        # падение в одном браузере не отменяет прогон в другом
      matrix:
        browser: [chrome, firefox, edge]

    steps:
      - name: Скачиваем код проекта
        uses: actions/checkout@v7

      # Образы хаба и узлов Grid docker compose скачивает сам при первом запуске
      - name: Запускаем тесты в Docker Compose (Selenium Grid)
        env:
          # Узлы браузеров живут в профилях compose: профиль = браузер матрицы
          COMPOSE_PROFILES: ${{ matrix.browser }}
          BROWSER: ${{ matrix.browser }}
          # pytest сам дочитывает аргументы из переменной PYTEST_ADDOPTS.
          # Маркер передаётся как данные, а не вклеивается в текст shell-команды
          PYTEST_ADDOPTS: ${{ inputs.test_marker && format('-m "{0}"', inputs.test_marker) || '' }}
        # Здесь больше НЕТ continue-on-error: упавшие тесты делают job и весь прогон красным.
        # Отчёт при этом всё равно соберётся: следующие шаги помечены if: always().
        # Именно up, а не run: run стартует только depends_on сервиса (хаб), а узлы
        # браузеров в depends_on не входят — их запускает профиль. --exit-code-from
        # останавливает стенд после тестов и возвращает код выхода pytest
        run: docker compose up --build --exit-code-from qa-framework

      - name: Возвращаем себе права на результаты
        # Контейнер пишет файлы от root; без этого upload-artifact не сможет их прочитать
        if: always()
        run: sudo chown -R "$USER:$USER" allure-results || true

      - name: Сохраняем сырые результаты Allure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 3

  # ==========================================
  # JOB 2: ОБЩИЙ ОТЧЁТ, ПУБЛИКАЦИЯ И УВЕДОМЛЕНИЕ
  # ==========================================
  allure-report:
    name: Allure report
    needs: test-execution
    if: always()              # отчёт нужен именно тогда, когда тесты упали
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write         # публикация отчёта в ветку gh-pages

    steps:
      - name: Скачиваем код проекта (нужен скрипт склейки)
        uses: actions/checkout@v7

      - name: Скачиваем результаты всех браузеров
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*   # каждый артефакт — в свою папку allure-results-<браузер>

      - name: Забираем прошлый отчёт (история для графика трендов)
        uses: actions/checkout@v7
        continue-on-error: true       # при самом первом запуске ветки gh-pages ещё нет
        with:
          ref: gh-pages
          path: previous-report

      - name: Склеиваем результаты браузеров и добавляем историю
        run: |
          python3 ci/merge_allure_results.py allure-results-*
          # Allure строит тренды из папки history прошлого отчёта, положенной в результаты
          # Массив вместо ls | head: имена папок не разбираются как текст (shellcheck SC2012)
          dirs=(allure-results-*)
          if [ -d previous-report/history ]; then
            cp -r previous-report/history "${dirs[0]}/"
            echo "История прошлых прогонов добавлена"
          fi

      - name: Генерируем отчёт
        run: |
          npm install -g allure-commandline@2.46.1
          allure generate allure-results-* -o allure-report --clean

      - name: Публикуем отчёт на GitHub Pages
        # Только для main: прогоны PR не должны подменять "официальный" отчёт
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Сохраняем отчёт как артефакт
        # Для PR это единственный способ посмотреть отчёт: скачать и открыть index.html
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

      - name: Уведомление в Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TESTS_RESULT: ${{ needs.test-execution.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then echo "Секрет TELEGRAM_TOKEN не задан — пропускаю"; exit 0; fi

          # Цифры берём из сгенерированного отчёта (xfail Allure считает как skipped)
          STATS=$(python3 -c "import json; s = json.load(open('allure-report/widgets/summary.json'))['statistic']; print(f\"Прошли: {s['passed']}, упали: {s['failed'] + s['broken']}, известные баги/пропуски: {s['skipped']}\")" 2>/dev/null || echo "Отчёт не сформирован")
          if [ "$TESTS_RESULT" = "success" ]; then ICON="✅"; else ICON="🔴"; fi
          if [ "$IS_MAIN" = "true" ]; then REPORT="$PAGES_URL"; else REPORT="$RUN_URL (артефакт allure-report)"; fi

          TEXT="$ICON Phonebook — GitHub Actions
          Событие: $GITHUB_EVENT_NAME, ветка: $GITHUB_REF_NAME
          Браузеры: chrome, firefox, edge
          Результат: $TESTS_RESULT
          $STATS
          Отчёт: $REPORT"

          # --data-urlencode корректно передаёт переводы строк, эмодзи и спецсимволы
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=${TEXT}" > /dev/null || echo "Не удалось отправить уведомление"

name: Phonebook UI Tests

on:
  workflow_dispatch:
      inputs:
        allow_mass_delete:
          description: 'Включить полное удаление всех контактов (DANGER!)'
          required: false
          type: boolean
          default: false

jobs:
  # =========================================
  # JOB 1: ПАРАЛЛЕЛЬНЫЙ ЗАПУСК ТЕСТОВ (МАТРИЦА)
  # =========================================
  test-execution:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Скачиваем код проекта
        uses: actions/checkout@v4

      - name: Подготавливаем переменные окружения для Docker
        run: |
          echo "USER_EMAIL=${{ secrets.USER_EMAIL }}" >> .env
          echo "USER_PASSWORD=${{ secrets.USER_PASSWORD }}" >> .env
          echo "ALLOW_MASS_DELETE=${{ github.event.inputs.allow_mass_delete }}" >> .env

      - name: Pull Selenoid Browser Images & Video Recorder
        run: |
          docker pull selenoid/vnc_chrome:128.0
          docker pull selenoid/vnc_firefox:125.0
          docker pull selenoid/video-recorder:latest-release

      - name: Запускаем автотесты в изолированной среде Docker Compose
        env:
          BROWSER: ${{ matrix.browser }}
        run: docker compose up --build --exit-code-from qa-framework
        continue-on-error: true

      - name: Исправляем права доступа для артефактов
        if: always()
        run: sudo chown -R $USER:$USER allure-results

      - name: Сохраняем сырые результаты Allure как артефакт
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 1

  # =========================================
  # JOB 2: СБОРКА ЕДИНОГО ОТЧЕТА И ПУБЛИКАЦИЯ
  # =========================================
  generate-report:
    needs: test-execution
    runs-on: ubuntu-22.04
    if: always()

    steps:
      - name: Скачиваем результаты Chrome
        uses: actions/download-artifact@v4
        with:
          name: allure-results-chrome
          path: allure-results-chrome

      - name: Скачиваем результаты Firefox
        uses: actions/download-artifact@v4
        with:
          name: allure-results-firefox
          path: allure-results-firefox

      - name: Уникализируем результаты и разносим по папкам в Allure
        run: |
          cat << 'EOF' > process_allure.py
          import json
          import glob

          def process_folder(folder, browser):
              files = glob.glob(f"{folder}/*result.json")
              print(f"[INFO] Найдено {len(files)} тестов в папке {folder}")
              for file_path in files:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
                  
                  # 1. Меняем ID, чтобы исключить склейку
                  if 'historyId' in data:
                      data['historyId'] = f"{data['historyId']}-{browser}"
                  
                  # 2. Переименовываем тест
                  if 'name' in data:
                      data['name'] = f"{data['name']} [{browser.upper()}]"
                  
                  # 3. Меняем Suite, чтобы в отчете они лежали в разных папках слева!
                  if 'labels' in data:
                      for label in data['labels']:
                          if label['name'] == 'suite':
                              label['value'] = f"{label['value']} ({browser.upper()})"
                      
                  with open(file_path, 'w', encoding='utf-8') as f:
                      json.dump(data, f)

          process_folder('allure-results-chrome', 'chrome')
          process_folder('allure-results-firefox', 'firefox')
          EOF
          
          python3 process_allure.py
          
          # Создаем файл окружения прямо в папке Chrome (Allure сам его подхватит)
          echo "Browsers=Chrome, Firefox" > allure-results-chrome/environment.properties
          echo "Environment=Docker Compose (Selenoid)" >> allure-results-chrome/environment.properties
          echo "CI=GitHub Actions Matrix" >> allure-results-chrome/environment.properties

      - name: Устанавливаем Allure CLI и генерируем ОБЩИЙ отчет
        run: |
          npm install -g allure-commandline --save-dev
          # ПЕРЕДАЕМ ОБЕ ПАПКИ НАПРЯМУЮ! Никаких cp -r, Allure всё сделает сам.
          allure generate allure-results-chrome allure-results-firefox -o allure-report --clean

      - name: Публикуем финальный отчет на GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Отправляем сводное уведомление в Telegram
        uses: appleboy/telegram-action@master
        with:
            to: ${{ secrets.TELEGRAM_TO }}
            token: ${{ secrets.TELEGRAM_TOKEN }}
            message: |
              🤖 Кроссбраузерные автотесты Phonebook завершены!
              🌐 Проверено в: Chrome и Firefox
              📊 Посмотреть общий Allure-отчет можно по ссылке:
              👉 https://warmanofmars-star.github.io/QA3553_Phonebook/
# Настройки gitleaks (хук в .pre-commit-config.yaml).
#
# Встроенные правила ловят секреты с узнаваемой структурой: токены Telegram,
# GitHub, AWS, приватные ключи. Но обычный пароль в формате .env
# (USER_PASSWORD=Qwerty123$) для них просто строка — проверено.
# А в этом проекте утечка была именно такой. Поэтому добавлено своё правило.

[extend]
useDefault = true   # встроенные правила остаются, наше добавляется к ним

[[rules]]
id = "env-style-password"
description = "Пароль в формате переменной окружения: ...PASSWORD=значение"
# Строка, начинающаяся с имени переменной, в котором есть PASSWORD/PASSWD, и непустое значение.
# Знак = без пробелов вокруг — как в .env. С пробелами правило ловило обычный Python
# (PASSWORD_CASES = [ ...]), а в .env пробелов вокруг = не бывает
regex = '''(?m)^[A-Z0-9_]*PASSW(?:OR)?D[A-Z0-9_]*=\S+'''
keywords = ["passw"]

  # Шаблон без настоящих значений — его коммитить можно и нужно
  [[rules.allowlists]]
  paths = ['''(^|/)\.env\.example$''']

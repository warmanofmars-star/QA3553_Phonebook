# Проверки, которые автоматически запускаются перед каждым `git commit`.
#
# Установка (один раз на машине, после клонирования репозитория):
#     pip install -r requirements.txt -r requirements-dev.txt
#     pre-commit install
#
# Ручной запуск на всех файлах (например, после обновления версий хуков):
#     pre-commit run --all-files
#
# Если хук нашёл проблему, коммит не создаётся. Часть хуков исправляет файлы сама —
# тогда достаточно проверить изменения, снова сделать `git add` и повторить коммит.
# Версии (rev) зафиксированы: обновлять их стоит осознанно, командой `pre-commit autoupdate`.
# Версия ruff — не здесь, а в requirements-dev.in (хуки ruff — local, см. ниже).

repos:
  # Базовая гигиена файлов
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace        # пробелы в конце строк
      - id: end-of-file-fixer          # ровно один перевод строки в конце файла
      - id: check-yaml                 # синтаксис YAML: compose-файлы, workflow GitHub Actions
      - id: check-toml                 # синтаксис pyproject.toml
      - id: check-merge-conflict       # забытые маркеры конфликтов <<<<<<< / >>>>>>>
      - id: check-added-large-files    # случайно добавленные большие файлы (видео, дампы)
        args: [--maxkb=1024]
      - id: detect-private-key         # приватные ключи (SSH, TLS)

  # Линтер и форматтер Python (настройки — в pyproject.toml).
  # language: system — ruff берётся из текущего окружения, поставленного из lock-файла
  # requirements-dev.txt: единственный источник версии — requirements-dev.in (job Lint ставит
  # ruff оттуда же). Раньше версия жила ещё в rev хука и в шаге job Lint, и три записи
  # приходилось менять синхронно. Поэтому коммить из активированного .venv: без него ruff
  # не найдётся, и хук упадёт.
  # Поля хуков — как у прежнего хука astral-sh/ruff-pre-commit (entry с --force-exclude, types_or,
  # require_serial)
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: [--fix]                  # исправимое — исправит сам, коммит всё равно остановится
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  # Конфиги GitHub — по JSON-схемам, встроенным в check-jsonschema (схемы лежат в пакете,
  # сеть не нужна). Опечатка в ключе или неверное значение иначе всплыли бы только на GitHub,
  # уже после слияния. language: system, как у ruff: check-jsonschema — из .venv, версия —
  # только в requirements-dev.in. Те же проверки — шаги job Lint
  - repo: local
    hooks:
      - id: check-dependabot
        name: validate Dependabot config against its schema
        entry: check-jsonschema --builtin-schema vendor.dependabot
        language: system
        files: ^\.github/dependabot\.yml$
      - id: check-github-workflows
        name: validate GitHub workflows against their schema
        entry: check-jsonschema --builtin-schema vendor.github-workflows
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

  # Поиск секретов в добавляемых изменениях: пароли, токены, ключи API.
  # Ровно та проблема, с которой начинался рефакторинг проекта.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1                       # единственный источник версии: job Secrets читает её отсюда
    hooks:
      - id: gitleaks

  # Свои проверки проекта
  - repo: local
    hooks:
      # Образы selenium/* в docker-compose*.yml — на одном теге релиза Grid 4 (4.x.y-ГГГГММДД):
      # Dependabot умеет уводить узлы на теги версий браузеров (подробности — в самом скрипте).
      # pass_filenames: false — согласованность тегов проверяется по всем compose-файлам сразу.
      # language: system — скрипт на stdlib, но запускается python из .venv, как и хуки ruff
      - id: check-selenium-images
        name: Selenium images share one Grid 4 tag
        entry: python ci/check_selenium_images.py
        language: system
        pass_filenames: false
        files: (^docker-compose.*\.ya?ml$|^ci/check_selenium_images\.py$)

      # docs/coverage.md актуален: та же проверка, что в job Lint, но до коммита — иначе
      # устаревшая матрица всплыла бы только в CI. Тесты не запускаются, только собираются
      # (логи logs/*.log при этом не трогаются, см. pytest_configure в conftest.py).
      # pass_filenames: false — матрица строится по всему набору тестов сразу.
      # files — всё, от чего зависит матрица: теги тестов, реестры багов и наблюдений,
      # справочник требований, сам генератор и настройки сбора pytest.
      # language: system — нужны pytest и pyyaml из .venv, как и хукам ruff
      - id: coverage-matrix
        name: coverage matrix docs/coverage.md is up to date
        entry: python ci/coverage_matrix.py --check
        language: system
        pass_filenames: false
        files: (^(tests|api_tests|data)/|^docs/(requirements_index\.yml|coverage\.md)$|^ci/coverage_matrix\.py$|^conftest\.py$|^pytest\.ini$)

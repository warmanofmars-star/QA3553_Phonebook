# Проверки, которые автоматически запускаются перед каждым `git commit`.
#
# Установка (один раз на машине, после клонирования репозитория):
#     pip install -r requirements-dev.txt
#     pre-commit install
#
# Ручной запуск на всех файлах (например, после обновления версий хуков):
#     pre-commit run --all-files
#
# Если хук нашёл проблему, коммит не создаётся. Часть хуков исправляет файлы сама —
# тогда достаточно проверить изменения, снова сделать `git add` и повторить коммит.
# Версии (rev) зафиксированы: обновлять их стоит осознанно, командой `pre-commit autoupdate`.

repos:
  # Базовая гигиена файлов
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace        # пробелы в конце строк
      - id: end-of-file-fixer          # ровно один перевод строки в конце файла
      - id: check-yaml                 # синтаксис YAML: compose-файлы, workflow GitHub Actions
      - id: check-toml                 # синтаксис pyproject.toml
      - id: check-merge-conflict       # забытые маркеры конфликтов <<<<<<< / >>>>>>>
      - id: check-added-large-files    # случайно добавленные большие файлы (видео, дампы)
        args: [--maxkb=1024]
      - id: detect-private-key         # приватные ключи (SSH, TLS)

  # Линтер и форматтер Python (настройки — в pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1                       # та же версия, что в requirements-dev.txt
    hooks:
      - id: ruff-check
        args: [--fix]                  # исправимое — исправит сам
      - id: ruff-format

  # Поиск секретов в добавляемых изменениях: пароли, токены, ключи API.
  # Ровно та проблема, с которой начинался рефакторинг проекта.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
